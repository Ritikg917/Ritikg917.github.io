<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Open Red Racing 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: 'Segoe UI', Tahoma, sans-serif;
      user-select: none;
    }
    #gameCanvas {
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated;
    }
    #hud {
      position: absolute; top: 16px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .hud-card {
      background: rgba(10, 14, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 18px;
      color: #fff;
      display: flex; flex-direction: column; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .hud-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .hud-val { font-size: 26px; font-weight: 900; color: #00e5ff; font-variant-numeric: tabular-nums; }
    .speed-unit { font-size: 13px; color: #94a3b8; margin-left: 2px; }
    #overlay {
      position: absolute; inset: 0; background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(10px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #fff;
    }
    .title-banner { font-size: 44px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase;
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #94a3b8; margin-bottom: 24px; font-weight: 500; }
    .start-btn {
      padding: 14px 40px; font-size: 18px; font-weight: 900; border: none;
      border-radius: 30px; background: linear-gradient(135deg, #ff0844, #ff4b2b);
      color: #fff; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 8, 68, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover { transform: scale(1.06); box-shadow: 0 8px 28px rgba(255, 8, 68, 0.7); }
    .controls-hint { margin-top: 24px; font-size: 13px; color: #64748b; }
    .controls-hint kbd {
      background: rgba(255,255,255,0.12); padding: 3px 8px; border-radius: 6px;
      color: #e2e8f0; font-family: inherit; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-card">
      <span class="hud-label">Speed</span>
      <span class="hud-val" id="speedVal">0 <span class="speed-unit">KM/H</span></span>
    </div>
    <div class="hud-card" style="text-align: center;">
      <span class="hud-label">Score / Distance</span>
      <span class="hud-val" id="scoreVal">0 <span class="speed-unit">M</span></span>
    </div>
    <div class="hud-card" style="text-align: right;">
      <span class="hud-label">Nitro NOS</span>
      <span class="hud-val" id="nitroVal" style="color: #ffaa00;">100%</span>
    </div>
  </div>

  <div id="overlay">
    <h1 class="title-banner">🏎️ OPEN RED RACING</h1>
    <p class="subtitle">High Speed Retro Arcade Formula Grand Prix</p>
    <button class="start-btn" id="startBtn">RACE NOW</button>
    <div class="controls-hint">
      <kbd>▲</kbd> Accelerate &bull; <kbd>◄</kbd> <kbd>►</kbd> Steer &bull; <kbd>▼</kbd> Brake &bull; <kbd>SPACE</kbd> Nitro NOS
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="game.js"></script>
</body>
</html>
