<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Highway Car Racing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #090d16; font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    #gameCanvas { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute; top: 16px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
      padding: 10px 18px; color: #fff;
    }
    .hud-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .hud-val { font-size: 24px; font-weight: 900; color: #ffd200; font-variant-numeric: tabular-nums; }
    .fuel-bar-wrap { width: 140px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .fuel-bar { height: 100%; width: 100%; background: #10b981; transition: width 0.1s; }
    #overlay {
      position: absolute; inset: 0; background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(10px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #fff;
    }
    .title-banner { font-size: 42px; font-weight: 900; color: #ffd200; margin-bottom: 8px; }
    .start-btn {
      padding: 14px 40px; font-size: 18px; font-weight: 900; border: none;
      border-radius: 30px; background: linear-gradient(135deg, #ffd200, #f59e0b);
      color: #030712; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 210, 0, 0.4);
      transition: transform 0.2s;
    }
    .start-btn:hover { transform: scale(1.05); }
    .controls-hint { margin-top: 24px; font-size: 13px; color: #94a3b8; }
    .controls-hint kbd {
      background: rgba(255,255,255,0.15); padding: 3px 8px; border-radius: 6px;
      color: #fff; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="scoreVal">0</div>
    </div>
    <div class="hud-box" style="text-align: center;">
      <div class="hud-label">Fuel</div>
      <div class="fuel-bar-wrap">
        <div class="fuel-bar" id="fuelBar"></div>
      </div>
    </div>
    <div class="hud-box" style="text-align: right;">
      <div class="hud-label">Speed</div>
      <div class="hud-val" id="speedVal" style="color: #00e5ff;">120 <span style="font-size: 12px; color: #94a3b8;">KM/H</span></div>
    </div>
  </div>

  <div id="overlay">
    <h1 class="title-banner">🚗 HIGHWAY TRAFFIC RACER</h1>
    <p style="color: #94a3b8; margin-bottom: 24px;">Dodge speeding traffic, collect fuel & set highest distance records!</p>
    <button class="start-btn" id="startBtn">START RACING</button>
    <div class="controls-hint">
      <kbd>◄</kbd> <kbd>►</kbd> Steer / Switch Lanes &bull; <kbd>▲</kbd> Turbo Speed &bull; <kbd>▼</kbd> Slow Down
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="game.js"></script>
</body>
</html>
