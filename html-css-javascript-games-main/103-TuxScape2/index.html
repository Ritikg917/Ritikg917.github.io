<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TuxScape 2 3D - RS Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { background: #070d1e; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; width: 100vw; height: 100vh; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .hud-pill { background: rgba(15, 23, 42, 0.85); border: 2px solid #06b6d4; border-radius: 14px; padding: 8px 18px; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); }
    .hud-pill .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #67e8f9; font-weight: 800; }
    .hud-pill .value { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #06b6d4; }
    
    #mobile-controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; pointer-events: auto; z-index: 20; }
    .btn-circle { width: 70px; height: 70px; border-radius: 50%; background: rgba(6, 182, 212, 0.3); border: 2.5px solid #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); backdrop-filter: blur(8px); cursor: pointer; }
    .btn-circle:active { background: rgba(6, 182, 212, 0.7); transform: scale(0.92); }
    
    .d-horizontal { display: flex; gap: 15px; }
    .d-arrow { width: 65px; height: 65px; border-radius: 14px; background: rgba(15, 23, 42, 0.75); border: 2px solid #06b6d4; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
    .d-arrow:active { background: rgba(6, 182, 212, 0.6); }

    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 13, 30, 0.88); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 25px; }
    #overlay h1 { font-size: 40px; font-weight: 900; background: linear-gradient(135deg, #67e8f9, #3b82f6, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
    #overlay p { font-size: 15px; color: #94a3b8; max-width: 440px; line-height: 1.6; margin-bottom: 25px; }
    .start-btn { background: linear-gradient(135deg, #0284c7, #06b6d4); border: none; color: #fff; font-size: 18px; font-weight: 900; padding: 15px 44px; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); letter-spacing: 1.5px; transition: transform 0.2s; pointer-events: auto; }
    .start-btn:hover { transform: scale(1.06); }
    .instructions { font-size: 12px; color: #64748b; margin-top: 15px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-pill">
        <div class="label">Gems Collected</div>
        <div id="gem-count" class="value">0</div>
      </div>
      <div class="hud-pill">
        <div class="label">Distance</div>
        <div id="dist-count" class="value">0 m</div>
      </div>
    </div>

    <div id="mobile-controls">
      <div class="d-horizontal">
        <div class="d-arrow" id="left-btn">◀</div>
        <div class="d-arrow" id="right-btn">▶</div>
      </div>
      <div class="btn-circle" id="jump-btn">🦘</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="ov-title">TuxScape 2: Arctic Rush</h1>
    <p id="ov-desc">Sprint across glacier ridges, leap over deadly crevices, collect golden Linux gems, and survive the icy tundra!</p>
    <button class="start-btn" id="start-btn">START EXPEDITION</button>
    <div class="instructions">Desktop: A/D or Left/Right to Steer | Space or Up Arrow to Jump</div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCoinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1318, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }
    function playJumpSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071126);
    scene.fog = new THREE.FogExp2(0x071126, 0.012);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Track segments
    const trackWidth = 12;
    const segments = [];
    const segmentCount = 20;
    const segLength = 25;
    for (let i = 0; i < segmentCount; i++) {
      const segGeom = new THREE.BoxGeometry(trackWidth, 1, segLength);
      const segMat = new THREE.MeshStandardMaterial({ 
        color: (i % 2 === 0) ? 0x0284c7 : 0x0369a1, 
        roughness: 0.2, 
        metalness: 0.1 
      });
      const seg = new THREE.Mesh(segGeom, segMat);
      seg.position.set(0, -0.5, -i * segLength);
      scene.add(seg);
      segments.push(seg);
    }

    // Tux Penguin Player
    const tux = new THREE.Group();
    const bodyGeom = new THREE.SphereGeometry(0.8, 16, 16);
    bodyGeom.scale(1, 1.4, 0.9);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
    const body = new THREE.Mesh(bodyGeom, bodyMat);
    body.position.y = 1.1;
    tux.add(body);

    const bellyGeom = new THREE.SphereGeometry(0.65, 16, 16);
    bellyGeom.scale(0.8, 1.1, 0.35);
    const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const belly = new THREE.Mesh(bellyGeom, bellyMat);
    belly.position.set(0, 1.0, 0.5);
    tux.add(belly);

    const beakGeom = new THREE.ConeGeometry(0.25, 0.5, 8);
    beakGeom.rotateX(Math.PI / 2);
    const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
    const beak = new THREE.Mesh(beakGeom, beakMat);
    beak.position.set(0, 1.5, 0.7);
    tux.add(beak);

    tux.position.set(0, 0, 0);
    scene.add(tux);

    // Obstacles & Gems
    const obstacles = [];
    const gems = [];

    function spawnObstacle(zPos) {
      const type = Math.random() > 0.4 ? 'spike' : 'boulder';
      if (type === 'spike') {
        const geom = new THREE.ConeGeometry(0.9, 2.2, 6);
        const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1 });
        const obs = new THREE.Mesh(geom, mat);
        obs.position.set((Math.random() - 0.5) * (trackWidth - 3), 1.1, zPos);
        scene.add(obs);
        obstacles.push(obs);
      } else {
        const geom = new THREE.SphereGeometry(1.2, 12, 12);
        const mat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
        const obs = new THREE.Mesh(geom, mat);
        obs.position.set((Math.random() - 0.5) * (trackWidth - 3), 1.2, zPos);
        scene.add(obs);
        obstacles.push(obs);
      }
    }

    function spawnGem(zPos) {
      const geom = new THREE.OctahedronGeometry(0.6);
      const mat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xeab308, roughness: 0.2 });
      const gem = new THREE.Mesh(geom, mat);
      gem.position.set((Math.random() - 0.5) * (trackWidth - 3), 1.5, zPos);
      scene.add(gem);
      gems.push(gem);
    }

    let isPlaying = false;
    let gemsCollected = 0;
    let distance = 0;
    let speed = 28;
    let vy = 0;
    let isGrounded = true;

    const keys = { left: false, right: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && isGrounded && isPlaying) {
        jump();
      }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    });

    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
      el.addEventListener('mousedown', () => keys[key] = true);
      el.addEventListener('mouseup', () => keys[key] = false);
    };
    bindTouch('left-btn', 'left');
    bindTouch('right-btn', 'right');
    document.getElementById('jump-btn').addEventListener('click', () => { if (isGrounded && isPlaying) jump(); });
    document.getElementById('jump-btn').addEventListener('touchstart', e => { e.preventDefault(); if (isGrounded && isPlaying) jump(); });

    function jump() {
      playJumpSound();
      vy = 14;
      isGrounded = false;
    }

    let spawnTimer = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (isPlaying) {
        // Move Track
        segments.forEach(s => {
          s.position.z += speed * delta;
          if (s.position.z > 20) {
            s.position.z -= segmentCount * segLength;
          }
        });

        // Steer
        if (keys.left && tux.position.x > -(trackWidth / 2 - 1.2)) tux.position.x -= 16 * delta;
        if (keys.right && tux.position.x < (trackWidth / 2 - 1.2)) tux.position.x += 16 * delta;

        // Jump physics
        if (!isGrounded) {
          tux.position.y += vy * delta;
          vy -= 35 * delta;
          if (tux.position.y <= 0) {
            tux.position.y = 0;
            vy = 0;
            isGrounded = true;
          }
        }

        // Camera follow
        camera.position.x = tux.position.x * 0.4;
        camera.lookAt(tux.position.x * 0.2, 1.5, -6);

        // Tux waddle
        if (isGrounded) {
          tux.rotation.z = Math.sin(time * 12) * 0.12;
        } else {
          tux.rotation.z = 0;
        }

        // Spawn obstacles & gems
        spawnTimer += delta;
        if (spawnTimer > 0.6) {
          spawnObstacle(-350);
          if (Math.random() > 0.3) spawnGem(-340);
          spawnTimer = 0;
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += speed * delta;
          if (obs.position.distanceTo(tux.position) < 1.6) {
            gameOver();
            return;
          }
          if (obs.position.z > 15) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }

        // Update Gems
        for (let i = gems.length - 1; i >= 0; i--) {
          const g = gems[i];
          g.position.z += speed * delta;
          g.rotation.y += 3.0 * delta;
          if (g.position.distanceTo(tux.position) < 1.8) {
            playCoinSound();
            scene.remove(g);
            gems.splice(i, 1);
            gemsCollected++;
            document.getElementById('gem-count').innerText = gemsCollected;
            continue;
          }
          if (g.position.z > 15) {
            scene.remove(g);
            gems.splice(i, 1);
          }
        }

        distance += Math.floor(speed * delta * 2);
        document.getElementById('dist-count').innerText = distance + ' m';
      }

      renderer.render(scene, camera);
    }

    function startGame() {
      gemsCollected = 0;
      distance = 0;
      tux.position.set(0, 0, 0);
      isPlaying = true;
      document.getElementById('gem-count').innerText = '0';
      document.getElementById('dist-count').innerText = '0 m';
      document.getElementById('overlay').style.display = 'none';

      obstacles.forEach(o => scene.remove(o));
      obstacles.length = 0;
      gems.forEach(g => scene.remove(g));
      gems.length = 0;
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('ov-title').innerText = 'CRASHED ON ICE!';
      document.getElementById('ov-desc').innerText = `You traveled ${distance} meters and collected ${gemsCollected} Linux gems!`;
      document.getElementById('start-btn').innerText = 'TRY AGAIN';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
