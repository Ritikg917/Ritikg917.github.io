<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_110" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="centerGlow_110" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="glow_110" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow_110" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Border & Background -->
  <rect x="4" y="4" width="292" height="292" rx="36" fill="url(#bgGrad_110)" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="150" cy="130" r="110" fill="url(#centerGlow_110)"/>

  <!-- Tech Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.2">
    <line x1="30" y1="60" x2="270" y2="60" />
    <line x1="30" y1="120" x2="270" y2="120" />
    <line x1="30" y1="180" x2="270" y2="180" />
    <line x1="90" y1="30" x2="90" y2="210" />
    <line x1="150" y1="30" x2="150" y2="210" />
    <line x1="210" y1="30" x2="210" y2="210" />
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="43" y="16" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1">PUZZLE</text>
  </g>

  <!-- Top Right Rating Stars -->
  <g transform="translate(200, 20)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#facc15" stroke-width="1.5"/>
    <text x="40" y="16" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle">★ 4.5</text>
  </g>

  <!-- Central Game Icon Badge -->
  <g transform="translate(150, 125)">
    <circle cx="0" cy="0" r="54" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="3" filter="url(#glow_110)" />
    <text x="0" y="20" font-size="52" text-anchor="middle" filter="url(#textShadow_110)">🧩</text>
  </g>

  <!-- Bottom Tag Badge -->
  <g transform="translate(150, 204)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="0" y="4" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">OFFLINE</text>
  </g>

  <!-- Title Bottom Bar -->
  <g transform="translate(150, 255)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="rgba(0,0,0,0.75)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle" filter="url(#textShadow_110)">Escape Road 3</text>
  </g>
</svg>